<text x="32" y="417" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#62666d">Measured: form wizard fixture, 5 variants (apps/form-*) · pnpm run form:bench → landing/form.json · measured 2026-08-12–08-18</text>
<text x="32" y="349" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="400" fill="#62666d">Cells count surviving capabilities (advance step, carry state, conditional toggle, render summary, render reference).</text>
<text x="32" y="366" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="400" fill="#62666d">Which ones is in bench/form-&lt;variant&gt;.json. "JS blocked" blocks *.js requests, exactly as in commerce, so it never</text>
<text x="32" y="383" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="400" fill="#62666d">reaches Astro, which ships its page logic in an inline script instead of an external bundle — surviving every condition</text>
<text x="32" y="400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="400" fill="#62666d">is that architecture, not a gap in the harness.</text>
