<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>확인 — 워크숍 신청</title><style>.wizard{color:#1a1a1a;max-width:560px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif}.wizard-progress{color:#888;gap:.5rem;padding:0;font-size:.85rem;list-style:none;display:flex}.wizard-progress li[aria-current=step]{color:#1a1a1a;font-weight:600}.wizard-progress li+li:before{content:"→";color:#ccc;margin-right:.5rem}.field{margin:1rem 0}.field label{margin-bottom:.25rem;font-size:.9rem;display:block}.field input[type=text],.field input[type=email],.field select{box-sizing:border-box;border:1px solid #ccc;border-radius:6px;width:100%;padding:.5rem;font-size:1rem}fieldset.field{border:1px solid #e0e0e0;border-radius:6px;padding:.75rem}fieldset.field label{align-items:center;gap:.35rem;margin-right:1rem;display:inline-flex}.wizard-next{color:#fff;cursor:pointer;background:#1a1a1a;border:0;border-radius:6px;padding:.6rem 1.4rem;font-size:1rem}.wizard-back{color:#666;margin-left:.75rem;font-size:.9rem}.summary{border:1px solid #e0e0e0;border-radius:6px;grid-template-columns:6rem 1fr;gap:.5rem;padding:1rem;display:grid}.summary dt{color:#888;font-size:.9rem}.summary dd{margin:0}.done-ref{letter-spacing:.05em;font-size:1.2rem;font-weight:700}
</style></head><body><main class="wizard"><ol class="wizard-progress"><li>참가자 정보</li><li>세션 선택</li><li aria-current="step">확인</li></ol><form class="wizard-step" data-step="3" method="get" action="../done/"><h1>신청 내용 확인</h1><dl class="summary"><dt>이름</dt><dd class="summary-name"></dd><dt>이메일</dt><dd class="summary-email"></dd><dt>참가 유형</dt><dd class="summary-type"></dd><dt>팀 이름</dt><dd class="summary-team"></dd><dt>세션</dt><dd class="summary-session"></dd><dt>식단</dt><dd class="summary-diet"></dd><dt>쿠폰</dt><dd class="summary-coupon"></dd></dl><p class="field confirm-row"><label><input id="confirm" name="confirm" type="checkbox" required> 위 내용이 맞습니다</label></p><div class="carried" hidden><input type="hidden" name="name" disabled><input type="hidden" name="email" disabled><input type="hidden" name="type" disabled><input type="hidden" name="team" disabled><input type="hidden" name="session" disabled><input type="hidden" name="diet" disabled><input type="hidden" name="coupon" disabled></div><button class="wizard-next" type="submit">신청하기</button><a class="wizard-back" href="../session/">이전</a></form></main></body></html><script>(function(){const SESSIONS = [{"id":"s-01","title":"시그널 아키텍처"},{"id":"s-02","title":"빌드 파이프라인"},{"id":"s-03","title":"하이드레이션 전략"},{"id":"s-04","title":"라우팅 계약"},{"id":"s-05","title":"캐시 무효화"},{"id":"s-06","title":"배포 자동화"}];
const DIET_OPTIONS = [{"id":"vegan","label":"비건"},{"id":"vegetarian","label":"채식"},{"id":"glutenfree","label":"글루텐프리"}];

  // Render the read-only summary and re-carry every collected value as
  // hidden inputs (diet is multi-valued, so it's cloned once per value).
  const params = new URLSearchParams(location.search);

  const typeLabel = value => (value === "team" ? "팀" : value === "individual" ? "개인" : "");
  const sessionLabel = value => {
    const session = SESSIONS.find(entry => entry.id === value);
    return session ? `${session.id} — ${session.title}` : "";
  };
  const dietLabel = values => {
    if (!values.length) return "";
    return values.map(value => DIET_OPTIONS.find(entry => entry.id === value)?.label ?? value).join(", ");
  };

  const setText = (selector, text) => {
    const el = document.querySelector(selector);
    if (el) el.textContent = text || "—";
  };

  setText(".summary-name", params.get("name"));
  setText(".summary-email", params.get("email"));
  setText(".summary-type", typeLabel(params.get("type")));
  setText(".summary-team", params.get("team"));
  setText(".summary-session", sessionLabel(params.get("session")));
  setText(".summary-diet", dietLabel(params.getAll("diet")));
  setText(".summary-coupon", params.get("coupon"));

  const carried = document.querySelector(".carried");
  const singleKeys = ["name", "email", "type", "team", "session", "coupon"];
  for (const key of singleKeys) {
    const input = carried?.querySelector(`input[name="${key}"]`);
    if (!input) continue;
    const value = params.get(key);
    if (value !== null) {
      input.value = value;
      input.disabled = false;
    } else {
      input.disabled = true;
    }
  }

  const dietTemplate = carried?.querySelector('input[name="diet"]');
  const dietValues = params.getAll("diet");
  if (dietTemplate) {
    dietTemplate.remove();
    for (const value of dietValues) {
      const clone = dietTemplate.cloneNode();
      clone.value = value;
      clone.disabled = false;
      carried.appendChild(clone);
    }
  }
})();</script>
