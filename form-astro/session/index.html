<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세션 선택 — 워크숍 신청</title><style>.wizard{color:#1a1a1a;max-width:560px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif}.wizard-progress{color:#888;gap:.5rem;padding:0;font-size:.85rem;list-style:none;display:flex}.wizard-progress li[aria-current=step]{color:#1a1a1a;font-weight:600}.wizard-progress li+li:before{content:"→";color:#ccc;margin-right:.5rem}.field{margin:1rem 0}.field label{margin-bottom:.25rem;font-size:.9rem;display:block}.field input[type=text],.field input[type=email],.field select{box-sizing:border-box;border:1px solid #ccc;border-radius:6px;width:100%;padding:.5rem;font-size:1rem}fieldset.field{border:1px solid #e0e0e0;border-radius:6px;padding:.75rem}fieldset.field label{align-items:center;gap:.35rem;margin-right:1rem;display:inline-flex}.wizard-next{color:#fff;cursor:pointer;background:#1a1a1a;border:0;border-radius:6px;padding:.6rem 1.4rem;font-size:1rem}.wizard-back{color:#666;margin-left:.75rem;font-size:.9rem}.summary{border:1px solid #e0e0e0;border-radius:6px;grid-template-columns:6rem 1fr;gap:.5rem;padding:1rem;display:grid}.summary dt{color:#888;font-size:.9rem}.summary dd{margin:0}.done-ref{letter-spacing:.05em;font-size:1.2rem;font-weight:700}
</style></head><body><main class="wizard"><ol class="wizard-progress"><li>참가자 정보</li><li aria-current="step">세션 선택</li><li>확인</li></ol><form class="wizard-step" data-step="2" method="get" action="../review/"><h1>세션 선택</h1><p class="field"><label for="session">세션</label><select id="session" name="session" required><option value="">세션을 선택하세요</option><option value="s-01">s-01 — 시그널 아키텍처</option><option value="s-02">s-02 — 빌드 파이프라인</option><option value="s-03">s-03 — 하이드레이션 전략</option><option value="s-04">s-04 — 라우팅 계약</option><option value="s-05">s-05 — 캐시 무효화</option><option value="s-06">s-06 — 배포 자동화</option></select></p><fieldset class="field"><legend>식단 옵션</legend><label><input type="checkbox" name="diet" value="vegan"> 비건</label><label><input type="checkbox" name="diet" value="vegetarian"> 채식</label><label><input type="checkbox" name="diet" value="glutenfree"> 글루텐프리</label></fieldset><p class="field"><label for="coupon">쿠폰 코드</label><input id="coupon" name="coupon" type="text" pattern="[A-Z]{4}-[0-9]{4}" placeholder="ABCD-1234"></p><div class="carried" hidden><input type="hidden" name="name" disabled><input type="hidden" name="email" disabled><input type="hidden" name="type" disabled><input type="hidden" name="team" disabled></div><button class="wizard-next" type="submit">다음</button><a class="wizard-back" href="../">이전</a></form></main></body></html><script type="module">var e=new URLSearchParams(location.search),t=document.querySelector(`.carried`);for(let n of[`name`,`email`,`type`,`team`]){let r=t?.querySelector(`input[name="${n}"]`);if(!r)continue;let i=e.get(n);i===null?r.disabled=!0:(r.value=i,r.disabled=!1)}</script>
