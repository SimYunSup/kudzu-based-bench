<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>참가자 정보 — 워크숍 신청</title><style>.wizard{color:#1a1a1a;max-width:560px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif}.wizard-progress{color:#888;gap:.5rem;padding:0;font-size:.85rem;list-style:none;display:flex}.wizard-progress li[aria-current=step]{color:#1a1a1a;font-weight:600}.wizard-progress li+li:before{content:"→";color:#ccc;margin-right:.5rem}.field{margin:1rem 0}.field label{margin-bottom:.25rem;font-size:.9rem;display:block}.field input[type=text],.field input[type=email],.field select{box-sizing:border-box;border:1px solid #ccc;border-radius:6px;width:100%;padding:.5rem;font-size:1rem}fieldset.field{border:1px solid #e0e0e0;border-radius:6px;padding:.75rem}fieldset.field label{align-items:center;gap:.35rem;margin-right:1rem;display:inline-flex}.wizard-next{color:#fff;cursor:pointer;background:#1a1a1a;border:0;border-radius:6px;padding:.6rem 1.4rem;font-size:1rem}.wizard-back{color:#666;margin-left:.75rem;font-size:.9rem}.summary{border:1px solid #e0e0e0;border-radius:6px;grid-template-columns:6rem 1fr;gap:.5rem;padding:1rem;display:grid}.summary dt{color:#888;font-size:.9rem}.summary dd{margin:0}.done-ref{letter-spacing:.05em;font-size:1.2rem;font-weight:700}
</style></head><body><main class="wizard"><ol class="wizard-progress"><li aria-current="step">참가자 정보</li><li>세션 선택</li><li>확인</li></ol><form class="wizard-step" data-step="1" method="get" action="session/"><h1>참가자 정보</h1><p class="field"><label for="name">이름</label><input id="name" name="name" type="text" required minlength="2" autocomplete="name"></p><p class="field"><label for="email">이메일</label><input id="email" name="email" type="email" required autocomplete="email"></p><fieldset class="field"><legend>참가 유형</legend><label><input type="radio" name="type" value="individual" checked> 개인</label><label><input type="radio" name="type" value="team"> 팀</label></fieldset><p class="field team-row"><label for="team-name">팀 이름</label><input id="team-name" name="team" type="text"></p><button class="wizard-next" type="submit">다음</button></form></main></body></html><script type="module">var e=document.querySelector(`.team-row`),t=document.querySelector(`#team-name`),n=document.querySelectorAll(`input[name="type"]`);function r(){let n=document.querySelector(`input[name="type"]:checked`)?.value===`team`;e&&(e.hidden=!n),t&&(t.disabled=!n,t.required=n)}n.forEach(e=>e.addEventListener(`change`,r)),r();</script>
