        // Theme toggle functionality
        function initTheme() {
          const themeToggle = document.querySelector("#theme-toggle");
          const lightIcon = document.querySelector("#theme-toggle-light-icon");
          const darkIcon = document.querySelector("#theme-toggle-dark-icon");

          // Get stored theme or default to 'light'
          const getStoredTheme = () => localStorage.getItem("theme") || "light";
          const setStoredTheme = (theme) => localStorage.setItem("theme", theme);

          // Apply theme to document
          const applyTheme = (theme) => {
            if (theme === "dark") {
              document.documentElement.setAttribute("data-theme", "dark");
              lightIcon.style.display = "none";
              darkIcon.style.display = "block";
            } else {
              document.documentElement.setAttribute("data-theme", "light");
              lightIcon.style.display = "block";
              darkIcon.style.display = "none";
            }
          };

          // Initialize theme on page load
          applyTheme(getStoredTheme());

          // Toggle theme on button click
          themeToggle?.addEventListener("click", () => {
            const currentTheme = getStoredTheme();
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            setStoredTheme(newTheme);
            applyTheme(newTheme);
          });
        }

        // Initialize on page load
        initTheme();

        // Re-initialize after navigation (for SPAs)
        document.addEventListener("astro:after-swap", initTheme);

        // Mobile menu toggle
        document.querySelector("#mobile-menu-button")?.addEventListener("click", () => {
          document.querySelector("#mobile-nav")?.classList.toggle("active");
        });
      </script></div></div><div id="mobile-nav" class="_mobile-nav_desrj_184"><a class="_link_desrj_84" href="/kudzu-based-bench/astro/home">Home</a><a class="_link_desrj_84" href="/kudzu-based-bench/astro/news/list/1">News</a><a class="_link_desrj_84" href="/kudzu-based-bench/astro/about">About us</a></div></header><div class="font-bold text-center mt-8 text-3xl">아무것도 없어요...😥</div><footer data-astro-cid-jo6i4kqk><nav class="variant-switch" aria-label="프레임워크 변형 전환" data-astro-cid-jo6i4kqk><a href="https://simyunsup.github.io/kudzu-based-bench/astro/" class="variant-link is-active" aria-current="page" data-astro-cid-jo6i4kqk>astro</a><a href="https://simyunsup.github.io/kudzu-based-bench/react-router/" class="variant-link" data-astro-cid-jo6i4kqk>react-router</a><a href="https://simyunsup.github.io/kudzu-based-bench/tanstack/" class="variant-link" data-astro-cid-jo6i4kqk>tanstack</a><a href="https://simyunsup.github.io/kudzu-based-bench/kudzu/" class="variant-link" data-astro-cid-jo6i4kqk>kudzu</a><a href="https://simyunsup.github.io/kudzu-based-bench/hugo/" class="variant-link" data-astro-cid-jo6i4kqk>hugo</a><a href="https://simyunsup.github.io/kudzu-based-bench/vitepress/" class="variant-link" data-astro-cid-jo6i4kqk>vitepress</a><a href="https://simyunsup.github.io/kudzu-based-bench/docusaurus/" class="variant-link" data-astro-cid-jo6i4kqk>docusaurus</a><a href="https://simyunsup.github.io/kudzu-based-bench/eleventy/" class="variant-link" data-astro-cid-jo6i4kqk>eleventy</a><a href="https://simyunsup.github.io/kudzu-based-bench/next-app/" class="variant-link" data-astro-cid-jo6i4kqk>next-app</a><a href="https://simyunsup.github.io/kudzu-based-bench/next-pages/" class="variant-link" data-astro-cid-jo6i4kqk>next-pages</a></nav>&copy; 2026 OTW for FE All rights reserved.</footer><script type="text/partytown" src="https://www.googletagmanager.com/gtag/js?id=G-LZV8S3RFR3"></script><script type="text/partytown">
